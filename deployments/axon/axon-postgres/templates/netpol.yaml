apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: axon-postgres
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: axon-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: axon
      ports:
        - port: 5432
          protocol: TCP
